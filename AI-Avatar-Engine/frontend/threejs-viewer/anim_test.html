<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Animation Library Test</title>
  <style>
    body { margin: 0; background: #202428; font-family: system-ui, sans-serif; color: #eee; }
    #hud { position: fixed; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,.6);
           padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.5; }
    #status { font-weight: 700; }
    #clip { font-size: 13px; margin-top: 6px; max-width: 240px; }
    #count { color: #7fd; font-weight: 700; }
  </style>
</head>
<body>
  <div id="hud">
    <div id="status">loading…</div>
    <div>animations: <span id="count">–</span></div>
    <div>playing: <span id="playing">–</span></div>
    <select id="clip"></select>
  </div>
  <script type="module" src="/src/anim_test.js"></script>
</body>
</html>
